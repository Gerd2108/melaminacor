services:
  postgres:
    image: postgres:16
    container_name: melamina-db
    environment:
      POSTGRES_DB: melamina
      POSTGRES_USER: melamina
      POSTGRES_PASSWORD: melamina
    ports:
      - "5432:5432"
    volumes:
      - melamina-data:/var/lib/postgresql/data

volumes:
  melamina-data:
